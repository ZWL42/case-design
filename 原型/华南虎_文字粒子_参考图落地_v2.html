<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>华南虎栖息地：人类扩张下的生存挤压 · 参考图落地 v2</title>
  <style>
    @font-face {
      font-family: "YangRenDongZhuShiTi";
      src: url("../sours/YangRenDongZhuShiTi-Light-2.ttf") format("truetype");
      font-display: swap;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0c11;
      color: rgba(240, 238, 234, 0.96);
      font-family: "YangRenDongZhuShiTi", "Songti SC", "STSong", serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: block;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: rgba(238, 226, 203, 0.9);
      background: rgba(8, 10, 14, 0.9);
      backdrop-filter: blur(2px);
    }

    #title {
      position: fixed;
      left: clamp(24px, 4.2vw, 64px);
      top: clamp(20px, 4.4vh, 56px);
      z-index: 8;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    #title h1 {
      margin: 0;
      font-weight: 600;
      font-size: clamp(30px, 3.85vw, 62px);
      line-height: 1.15;
      letter-spacing: 0.02em;
      color: rgba(245, 240, 233, 0.97);
    }

    #title p {
      margin: 10px 0 0;
      font-size: clamp(14px, 1.15vw, 20px);
      color: rgba(210, 218, 228, 0.82);
      letter-spacing: 0.03em;
    }

    #hint {
      position: fixed;
      right: 18px;
      bottom: 14px;
      z-index: 8;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      color: rgba(215, 220, 228, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(9, 12, 17, 0.45);
      backdrop-filter: blur(2px);
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="loading">正在构建参考图风格文字地形...</div>

  <div id="title">
    <h1>华南虎栖息地：人类扩张下的生存挤压</h1>
    <p>一项基于历史栖息地与人口扩张数据的艺术叙事可视化</p>
  </div>

  <div id="hint">1/2/3 阶段切换 · 空格重置粒子</div>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const loadingEl = document.getElementById("loading");

    let w = 0;
    let h = 0;
    let dpr = 1;

    const CHAR_NATURE = ["林", "山", "岭", "谷", "泽", "溪", "涧", "莽"];
    const CHAR_HUMAN = ["人", "众", "村", "镇", "城", "路", "厂", "矿", "网", "开", "扩"];

    const STAGES = [
      {
        name: "山林主导",
        pressure: 0.17,
        densityBoost: 1.0,
        threshold: 0.94,
        particles: 520,
        collapse: 0.00026,
        lineSpread: 0.021
      },
      {
        name: "开发扩张",
        pressure: 0.58,
        densityBoost: 1.03,
        threshold: 0.81,
        particles: 220,
        collapse: 0.0028,
        lineSpread: 0.026
      },
      {
        name: "极危现实",
        pressure: 0.98,
        densityBoost: 1.08,
        threshold: 0.68,
        particles: 58,
        collapse: 0.0086,
        lineSpread: 0.03
      }
    ];

    const HUMAN_CENTERS = [
      { x: 0.60, y: 0.55, r: 0.068, w: 1.0 },
      { x: 0.72, y: 0.52, r: 0.064, w: 0.94 },
      { x: 0.79, y: 0.58, r: 0.060, w: 0.88 },
      { x: 0.52, y: 0.62, r: 0.060, w: 0.82 },
      { x: 0.67, y: 0.67, r: 0.056, w: 0.74 }
    ];

    const HUMAN_LINES = [
      { a: { x: 0.50, y: 0.61 }, b: { x: 0.77, y: 0.51 }, w: 0.82 },
      { a: { x: 0.46, y: 0.58 }, b: { x: 0.73, y: 0.66 }, w: 0.76 },
      { a: { x: 0.57, y: 0.47 }, b: { x: 0.86, y: 0.55 }, w: 0.72 }
    ];

    const REFUGES = [
      { x: 0.36, y: 0.63, w: 1.0 },
      { x: 0.44, y: 0.54, w: 0.95 },
      { x: 0.50, y: 0.70, w: 0.86 },
      { x: 0.61, y: 0.47, w: 0.8 }
    ];

    let stageIdx = 1;
    let particles = [];

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function rand(a = 0, b = 1) { return a + Math.random() * (b - a); }
    function mix(a, b, t) { return a + (b - a) * t; }
    function dist2(ax, ay, bx, by) { const dx = ax - bx; const dy = ay - by; return dx * dx + dy * dy; }

    function hash(ix, iy) {
      const n = Math.sin(ix * 127.1 + iy * 311.7) * 43758.5453123;
      return n - Math.floor(n);
    }

    function valueNoise(x, y) {
      const x0 = Math.floor(x);
      const y0 = Math.floor(y);
      const x1 = x0 + 1;
      const y1 = y0 + 1;
      const tx = x - x0;
      const ty = y - y0;
      const sx = tx * tx * (3 - 2 * tx);
      const sy = ty * ty * (3 - 2 * ty);

      const n00 = hash(x0, y0);
      const n10 = hash(x1, y0);
      const n01 = hash(x0, y1);
      const n11 = hash(x1, y1);

      const nx0 = n00 * (1 - sx) + n10 * sx;
      const nx1 = n01 * (1 - sx) + n11 * sx;
      return nx0 * (1 - sy) + nx1 * sy;
    }

    function fbm(x, y) {
      let sum = 0;
      let amp = 0.5;
      let freq = 1;
      for (let i = 0; i < 4; i += 1) {
        sum += valueNoise(x * freq, y * freq) * amp;
        amp *= 0.5;
        freq *= 2.1;
      }
      return sum;
    }

    function distPointToSeg(px, py, ax, ay, bx, by) {
      const vx = bx - ax;
      const vy = by - ay;
      const wx = px - ax;
      const wy = py - ay;
      const c1 = vx * wx + vy * wy;
      if (c1 <= 0) return Math.hypot(px - ax, py - ay);
      const c2 = vx * vx + vy * vy;
      if (c1 >= c2) return Math.hypot(px - bx, py - by);
      const t = c1 / c2;
      const qx = ax + t * vx;
      const qy = ay + t * vy;
      return Math.hypot(px - qx, py - qy);
    }

    function habitatField(x, y) {
      // 让主体构图更像参考图：中下方的大跨度斜向形体
      const cx = 0.58;
      const cy = 0.60;
      const dx = x - cx;
      const dy = y - cy;
      const rot = -0.12;
      const xr = dx * Math.cos(rot) - dy * Math.sin(rot);
      const yr = dx * Math.sin(rot) + dy * Math.cos(rot);

      const body = Math.exp(-(xr * xr / 0.115 + yr * yr / 0.057));
      const tongueW = Math.exp(-((x - 0.43) * (x - 0.43) / 0.055 + (y - 0.69) * (y - 0.69) / 0.045));
      const tongueE = Math.exp(-((x - 0.79) * (x - 0.79) / 0.047 + (y - 0.56) * (y - 0.56) / 0.036));
      const topArc = Math.exp(-((x - 0.67) * (x - 0.67) / 0.094 + (y - 0.45) * (y - 0.45) / 0.03));

      const n = fbm(x * 9.4 + 21.2, y * 8.8 - 13.7);
      const ridge = fbm(x * 17.7 + 4.2, y * 16.9 + 11.8);

      return body * 0.77 + tongueW * 0.53 + tongueE * 0.42 + topArc * 0.36 + n * 0.28 + ridge * 0.11;
    }

    function terrainSuit(x, y) {
      const westHigh = clamp((0.65 - x) * 1.5 + 0.35, 0, 1);
      const ridge = 0.5 + 0.5 * Math.sin(x * 14.2 + y * 9.4 + Math.sin(x * 7.9));
      const rough = fbm(x * 12.0 + 3.0, y * 11.5 + 7.0);
      const coastPenalty = clamp((x - 0.75) * 2.2, 0, 1) * clamp((y - 0.62) * 2.1, 0, 1);
      return clamp(0.2 + westHigh * 0.34 + ridge * 0.21 + rough * 0.26 - coastPenalty * 0.2, 0, 1);
    }

    function inHabitat(x, y) {
      const s = habitatField(x, y);
      const threshold = 0.56;
      return s > threshold && terrainSuit(x, y) > 0.36;
    }

    function pressureAt(x, y) {
      const stage = STAGES[stageIdx];
      let p = 0;

      for (let i = 0; i < HUMAN_CENTERS.length; i += 1) {
        const c = HUMAN_CENTERS[i];
        const d = Math.hypot(x - c.x, y - c.y);
        p += c.w * Math.exp(-(d * d) / (2 * c.r * c.r));
      }

      for (let i = 0; i < HUMAN_LINES.length; i += 1) {
        const line = HUMAN_LINES[i];
        const d = distPointToSeg(x, y, line.a.x, line.a.y, line.b.x, line.b.y);
        const r = stage.lineSpread;
        p += line.w * Math.exp(-(d * d) / (2 * r * r));
      }

      const eastPush = clamp((x - 0.58) * 1.9, 0, 1) * 0.54;
      return p * stage.pressure + eastPush * stage.pressure;
    }

    function pressureGradient(x, y) {
      const e = 0.0035;
      return {
        x: (pressureAt(x + e, y) - pressureAt(x - e, y)) / (2 * e),
        y: (pressureAt(x, y + e) - pressureAt(x, y - e)) / (2 * e)
      };
    }

    function nearestRefuge(x, y) {
      let best = REFUGES[0];
      let bestD = Infinity;
      for (let i = 0; i < REFUGES.length; i += 1) {
        const r = REFUGES[i];
        const d = dist2(x, y, r.x, r.y) / (0.18 + r.w * 0.85);
        if (d < bestD) {
          bestD = d;
          best = r;
        }
      }
      return best;
    }

    function resize() {
      dpr = Math.max(1, window.devicePixelRatio || 1);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function spawnPoint(preferRefuge) {
      for (let i = 0; i < 140; i += 1) {
        let x;
        let y;
        if (preferRefuge) {
          const r = REFUGES[(Math.random() * REFUGES.length) | 0];
          x = r.x + rand(-0.05, 0.05);
          y = r.y + rand(-0.05, 0.05);
        } else {
          x = rand(0.14, 0.95);
          y = rand(0.22, 0.9);
        }
        if (!inHabitat(x, y)) continue;
        if (pressureAt(x, y) > 1.42) continue;
        return { x, y };
      }
      return { x: 0.54, y: 0.62 };
    }

    function createParticle(seedToRefuge = false) {
      const s = spawnPoint(seedToRefuge);
      return {
        x: s.x,
        y: s.y,
        vx: rand(-0.008, 0.008),
        vy: rand(-0.008, 0.008),
        phase: rand(0, Math.PI * 2),
        stride: rand(0.75, 1.2),
        energy: rand(0.7, 1),
        age: rand(0, 1200),
        alive: true
      };
    }

    function reseed() {
      particles = [];
      const n = STAGES[stageIdx].particles;
      for (let i = 0; i < n; i += 1) particles.push(createParticle(stageIdx === 2));
    }

    function sampleNeighbors(p, count = 16) {
      const out = [];
      if (particles.length < 2) return out;
      for (let i = 0; i < count; i += 1) {
        const q = particles[(Math.random() * particles.length) | 0];
        if (q === p) continue;
        const d2 = dist2(p.x, p.y, q.x, q.y);
        if (d2 < 0.01) out.push({ q, d2 });
      }
      return out;
    }

    function stepParticle(p, dt) {
      const ns = sampleNeighbors(p, 16);
      let cohX = 0;
      let cohY = 0;
      let sepX = 0;
      let sepY = 0;
      let n = 0;

      for (let i = 0; i < ns.length; i += 1) {
        const q = ns[i].q;
        const d = Math.sqrt(ns[i].d2) + 1e-6;
        cohX += q.x;
        cohY += q.y;
        n += 1;
        if (d < 0.028) {
          sepX += (p.x - q.x) / d;
          sepY += (p.y - q.y) / d;
        }
      }

      if (n > 0) {
        cohX = cohX / n - p.x;
        cohY = cohY / n - p.y;
      }

      const g = pressureGradient(p.x, p.y);
      const fleeX = -g.x;
      const fleeY = -g.y;
      const r = nearestRefuge(p.x, p.y);
      const migX = r.x - p.x;
      const migY = r.y - p.y;
      const wX = Math.cos(p.phase + p.age * 0.022) * 0.62;
      const wY = Math.sin(p.phase * 0.8 + p.age * 0.018) * 0.62;

      p.vx += (cohX * 0.32 + sepX * 0.86 + fleeX * 0.63 + migX * STAGES[stageIdx].pressure * 0.58 + wX * 0.26) * dt;
      p.vy += (cohY * 0.32 + sepY * 0.86 + fleeY * 0.63 + migY * STAGES[stageIdx].pressure * 0.58 + wY * 0.26) * dt;

      p.vx *= 0.975;
      p.vy *= 0.975;

      const vmax = 0.18 * p.stride;
      const vl = Math.hypot(p.vx, p.vy) || 1e-6;
      if (vl > vmax) {
        p.vx = (p.vx / vl) * vmax;
        p.vy = (p.vy / vl) * vmax;
      }

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.age += dt * 60;

      if (!inHabitat(p.x, p.y)) {
        p.x = mix(p.x, r.x, 0.1);
        p.y = mix(p.y, r.y, 0.1);
        p.vx *= 0.58;
        p.vy *= 0.58;
      }

      const risk = clamp(pressureAt(p.x, p.y) - (0.42 - stageIdx * 0.09), 0, 2.2);
      if (Math.random() < STAGES[stageIdx].collapse * risk) p.alive = false;
    }

    function regulatePopulation() {
      const target = STAGES[stageIdx].particles;
      if (particles.length < target) {
        for (let i = 0; i < Math.min(4, target - particles.length); i += 1) particles.push(createParticle(stageIdx === 2));
      } else if (particles.length > target) {
        particles.length = Math.max(target, particles.length - 4);
      }
    }

    function drawBackground(now) {
      ctx.clearRect(0, 0, w, h);

      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, "#1a1e27");
      g.addColorStop(0.35, "#151a22");
      g.addColorStop(0.75, "#11161f");
      g.addColorStop(1, "#0d1119");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      const t = now * 0.00012;
      for (let i = 0; i < 3; i += 1) {
        const cx = w * (0.45 + Math.sin(t + i * 1.7) * 0.05 + i * 0.08);
        const cy = h * (0.54 + Math.cos(t * 1.2 + i * 1.3) * 0.06);
        const rg = ctx.createRadialGradient(cx, cy, 20, cx, cy, Math.max(w, h) * 0.42);
        rg.addColorStop(0, "rgba(255,170,86,0.02)");
        rg.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = rg;
        ctx.fillRect(0, 0, w, h);
      }

      const v = ctx.createRadialGradient(w * 0.56, h * 0.58, Math.min(w, h) * 0.1, w * 0.56, h * 0.58, Math.max(w, h) * 0.72);
      v.addColorStop(0, "rgba(0,0,0,0)");
      v.addColorStop(1, "rgba(0,0,0,0.46)");
      ctx.fillStyle = v;
      ctx.fillRect(0, 0, w, h);
    }

    function drawTextField(now) {
      const stage = STAGES[stageIdx];
      const cell = 9;
      const t = now * 0.001;

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = '9px "YangRenDongZhuShiTi", "Songti SC", serif';

      const minX = Math.floor(w * 0.12);
      const maxX = Math.floor(w * 0.96);
      const minY = Math.floor(h * 0.19);
      const maxY = Math.floor(h * 0.9);

      for (let py = minY; py < maxY; py += cell) {
        for (let px = minX; px < maxX; px += cell) {
          const nx = px / w;
          const ny = py / h;

          if (!inHabitat(nx, ny)) continue;

          const field = habitatField(nx, ny);
          const terrain = terrainSuit(nx, ny);
          const pressure = pressureAt(nx, ny);
          const jitter = 0.5 + 0.5 * Math.sin(nx * 37.1 + ny * 25.2 + t * 1.4);

          const humanFactor = clamp(pressure * 1.12 + stageIdx * 0.16, 0, 1.5);
          const natureFactor = clamp(terrain * 1.05 * (1.15 - humanFactor * 0.78), 0, 1.25);
          const fillProb = clamp((field - 0.54) * 2.1 * stage.densityBoost, 0.13, 0.96);

          if (Math.random() > fillProb) continue;

          let glyph = "";
          let alpha = 0;
          let color = "rgba(217,222,232,0.3)";

          if (humanFactor > stage.threshold && Math.random() < 0.25 + humanFactor * 0.24) {
            const idx = (Math.floor(nx * 79 + ny * 41 + t * 2.8) % CHAR_HUMAN.length + CHAR_HUMAN.length) % CHAR_HUMAN.length;
            glyph = CHAR_HUMAN[idx];
            alpha = clamp(0.11 + (humanFactor - stage.threshold) * 0.52 + jitter * 0.08, 0.08, 0.58);
            color = stageIdx === 2 ? "rgba(248,173,107,0.62)" : "rgba(228,232,240,0.56)";
          } else if (natureFactor > 0.19 && Math.random() < 0.31 + natureFactor * 0.28) {
            const idx = (Math.floor(nx * 43 + ny * 57 + t * 1.7) % CHAR_NATURE.length + CHAR_NATURE.length) % CHAR_NATURE.length;
            glyph = CHAR_NATURE[idx];
            alpha = clamp(0.1 + natureFactor * 0.28 + jitter * 0.07, 0.08, 0.48);
            color = "rgba(216,221,230,0.5)";
          }

          if (!glyph) continue;

          ctx.fillStyle = color.replace(/\d*\.?\d+\)$/g, `${alpha})`);
          ctx.fillText(glyph, px, py);
        }
      }
    }

    function drawParticles() {
      for (let i = 0; i < particles.length; i += 1) {
        const p = particles[i];
        const x = p.x * w;
        const y = p.y * h;
        const speed = Math.hypot(p.vx, p.vy);

        const core = 0.5 + p.energy * 0.48;
        const glow = 1.9 + speed * 7.2;

        const grad = ctx.createRadialGradient(x, y, 0, x, y, glow);
        grad.addColorStop(0, "rgba(249,175,86,0.83)");
        grad.addColorStop(0.6, "rgba(240,139,46,0.38)");
        grad.addColorStop(1, "rgba(240,139,46,0)");

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, glow, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255,190,104,0.9)";
        ctx.beginPath();
        ctx.arc(x, y, core, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function step(dt) {
      regulatePopulation();
      for (let i = particles.length - 1; i >= 0; i -= 1) {
        const p = particles[i];
        stepParticle(p, dt);
        if (!p.alive) particles.splice(i, 1);
      }
    }

    let prev = performance.now();
    function loop(now) {
      const dt = clamp((now - prev) / 1000, 0.001, 0.05);
      prev = now;

      step(dt);
      drawBackground(now);
      drawTextField(now);
      drawParticles();

      requestAnimationFrame(loop);
    }

    function setStage(i) {
      stageIdx = clamp(i, 0, STAGES.length - 1);
      reseed();
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "1") setStage(0);
      else if (e.key === "2") setStage(1);
      else if (e.key === "3") setStage(2);
      else if (e.code === "Space") reseed();
    });

    window.addEventListener("resize", resize);

    async function init() {
      resize();
      try {
        await document.fonts.load('700 40px "YangRenDongZhuShiTi"');
        await document.fonts.load('400 12px "YangRenDongZhuShiTi"');
      } catch (err) {
        console.warn("font load fallback", err);
      }
      setStage(1);
      if (loadingEl) loadingEl.style.display = "none";
      requestAnimationFrame(loop);
    }

    init();
  </script>
</body>
</html>
