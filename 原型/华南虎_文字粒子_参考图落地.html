<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>华南虎栖息地：人类扩张下的生存挤压 · 参考图落地版</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0d12;
      color: rgba(245, 245, 245, 0.95);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #stage {
      position: fixed;
      inset: 0;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 8;
      background: rgba(11, 13, 18, 0.9);
      color: rgba(255, 238, 214, 0.9);
      letter-spacing: 0.08em;
      font-size: 13px;
    }
    #title {
      position: fixed;
      left: 58px;
      top: 46px;
      z-index: 9;
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
    }
    #title h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 58px);
      font-weight: 650;
      letter-spacing: 0.03em;
      color: rgba(247, 239, 228, 0.97);
      line-height: 1.12;
    }
    #title p {
      margin: 12px 0 0;
      font-size: clamp(13px, 1.22vw, 20px);
      color: rgba(214, 220, 228, 0.8);
      letter-spacing: 0.02em;
    }
    #meta {
      position: fixed;
      right: 22px;
      bottom: 18px;
      z-index: 9;
      font-size: 11px;
      color: rgba(213, 218, 225, 0.74);
      background: rgba(10, 12, 17, 0.54);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 6px 9px;
      backdrop-filter: blur(3px);
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="loading">正在构建文字地形与粒子场...</div>

  <div id="title">
    <h1>华南虎栖息地：人类扩张下的生存挤压</h1>
    <p>一项基于历史栖息地与人口扩张数据的艺术叙事可视化</p>
  </div>

  <div id="meta">1/2/3 切换阶段 · 当前阶段：<span id="stage-name">开发扩张</span></div>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const loadingEl = document.getElementById("loading");
    const stageNameEl = document.getElementById("stage-name");

    const SOUTH_PROVINCES = [
      { code: "500000", name: "重庆" },
      { code: "520000", name: "贵州" },
      { code: "430000", name: "湖南" },
      { code: "420000", name: "湖北" },
      { code: "360000", name: "江西" },
      { code: "350000", name: "福建" },
      { code: "440000", name: "广东" },
      { code: "450000", name: "广西" }
    ];

    const CITY_HOTSPOTS_LL = [
      { lon: 113.264, lat: 23.129, r: 0.074, w: 1.0 },
      { lon: 114.058, lat: 22.543, r: 0.068, w: 0.95 },
      { lon: 112.938, lat: 28.228, r: 0.07, w: 0.9 },
      { lon: 115.858, lat: 28.683, r: 0.068, w: 0.84 },
      { lon: 119.296, lat: 26.074, r: 0.067, w: 0.8 },
      { lon: 106.63, lat: 26.647, r: 0.07, w: 0.76 },
      { lon: 108.32, lat: 22.82, r: 0.068, w: 0.74 },
      { lon: 106.551, lat: 29.563, r: 0.067, w: 0.72 }
    ];

    const ROAD_SEGMENTS_LL = [
      { a: { lon: 106.551, lat: 29.563 }, b: { lon: 113.264, lat: 23.129 }, w: 0.85, r: 0.022 },
      { a: { lon: 112.938, lat: 28.228 }, b: { lon: 119.296, lat: 26.074 }, w: 0.74, r: 0.02 },
      { a: { lon: 108.32, lat: 22.82 }, b: { lon: 114.058, lat: 22.543 }, w: 0.7, r: 0.019 }
    ];

    const REFUGES_LL = [
      { lon: 110.43, lat: 25.85, w: 1.0 },
      { lon: 112.25, lat: 24.55, w: 0.95 },
      { lon: 113.75, lat: 26.28, w: 0.9 },
      { lon: 117.72, lat: 27.75, w: 0.84 },
      { lon: 110.35, lat: 27.45, w: 0.82 }
    ];

    const STAGES = [
      { name: "山林主导", pressure: 0.18, particles: 460, threshold: 0.98, collapse: 0.00045 },
      { name: "开发扩张", pressure: 0.56, particles: 170, threshold: 0.86, collapse: 0.0032 },
      { name: "极危现实", pressure: 0.98, particles: 32, threshold: 0.71, collapse: 0.0098 }
    ];

    const CHAR_NATURE = ["林", "山", "岭", "谷", "水", "泽", "莽", "川"];
    const CHAR_HUMAN = ["人", "众", "村", "镇", "城", "路", "厂", "矿", "网", "开", "扩"];

    let dpr = 1;
    let w = 0;
    let h = 0;

    let geoBounds = null;
    let geoPolygons = [];
    let geoReady = false;

    let cityHotspots = [];
    let roadSegments = [];
    let refuges = [];

    let stageIdx = 1;
    let particles = [];

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function rand(a = 0, b = 1) { return a + Math.random() * (b - a); }
    function mix(a, b, t) { return a + (b - a) * t; }
    function dist2(ax, ay, bx, by) { const dx = ax - bx; const dy = ay - by; return dx * dx + dy * dy; }

    function llToNorm(lon, lat) {
      const pad = 0.07;
      const nx = (lon - geoBounds.minLon) / (geoBounds.maxLon - geoBounds.minLon);
      const ny = (geoBounds.maxLat - lat) / (geoBounds.maxLat - geoBounds.minLat);
      return { x: pad + nx * (1 - pad * 2), y: pad + ny * (1 - pad * 2) };
    }

    function normToLL(x, y) {
      const pad = 0.07;
      const nx = clamp((x - pad) / (1 - pad * 2), 0, 1);
      const ny = clamp((y - pad) / (1 - pad * 2), 0, 1);
      return {
        lon: geoBounds.minLon + nx * (geoBounds.maxLon - geoBounds.minLon),
        lat: geoBounds.maxLat - ny * (geoBounds.maxLat - geoBounds.minLat)
      };
    }

    function pointInRing(x, y, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i].x, yi = ring[i].y;
        const xj = ring[j].x, yj = ring[j].y;
        const cross = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi);
        if (cross) inside = !inside;
      }
      return inside;
    }

    function pointInRegion(x, y) {
      for (let i = 0; i < geoPolygons.length; i += 1) {
        const p = geoPolygons[i];
        if (!pointInRing(x, y, p.outer)) continue;
        let inHole = false;
        for (let hIdx = 0; hIdx < p.holes.length; hIdx += 1) {
          if (pointInRing(x, y, p.holes[hIdx])) { inHole = true; break; }
        }
        if (!inHole) return true;
      }
      return false;
    }

    function terrainSuit(x, y) {
      const ll = normToLL(x, y);
      const westHigh = clamp((111.8 - ll.lon) / 10.8, 0, 1);
      const ridge = 0.5 + 0.5 * Math.sin(ll.lon * 0.63 + ll.lat * 1.15);
      const rough = 0.5 + 0.5 * Math.sin(ll.lon * 3.0 - ll.lat * 3.7 + Math.sin(ll.lat * 0.85));
      const coastPenalty = clamp((ll.lon - 116.1) / 5.7, 0, 1) * clamp((25.4 - ll.lat) / 8.4, 0, 1);
      return clamp(0.24 + westHigh * 0.35 + ridge * 0.22 + rough * 0.19 - coastPenalty * 0.27, 0, 1);
    }

    function inHabitat(x, y) {
      if (!geoReady) return false;
      if (!pointInRegion(x, y)) return false;
      return terrainSuit(x, y) > 0.34;
    }

    function pressureAt(x, y) {
      const stage = STAGES[stageIdx];
      const pressureScale = stage.pressure;
      let p = 0;
      for (let i = 0; i < cityHotspots.length; i += 1) {
        const c = cityHotspots[i];
        const d = Math.hypot(x - c.x, y - c.y);
        p += c.w * Math.exp(-(d * d) / (2 * c.r * c.r));
      }
      for (let i = 0; i < roadSegments.length; i += 1) {
        const r = roadSegments[i];
        const d = distPointToSeg(x, y, r.a.x, r.a.y, r.b.x, r.b.y);
        p += r.w * Math.exp(-(d * d) / (2 * r.r * r.r));
      }
      return p * pressureScale;
    }

    function pressureGradient(x, y) {
      const e = 0.0038;
      return {
        x: (pressureAt(x + e, y) - pressureAt(x - e, y)) / (2 * e),
        y: (pressureAt(x, y + e) - pressureAt(x, y - e)) / (2 * e)
      };
    }

    function nearestRefuge(x, y) {
      let best = refuges[0] || { x: 0.56, y: 0.58, w: 1 };
      let bestD = Infinity;
      for (let i = 0; i < refuges.length; i += 1) {
        const r = refuges[i];
        const d = dist2(x, y, r.x, r.y) / (0.24 + r.w * 0.76);
        if (d < bestD) { bestD = d; best = r; }
      }
      return best;
    }

    function distPointToSeg(px, py, ax, ay, bx, by) {
      const vx = bx - ax;
      const vy = by - ay;
      const wx = px - ax;
      const wy = py - ay;
      const c1 = vx * wx + vy * wy;
      if (c1 <= 0) return Math.hypot(px - ax, py - ay);
      const c2 = vx * vx + vy * vy;
      if (c2 <= c1) return Math.hypot(px - bx, py - by);
      const t = c1 / c2;
      const qx = ax + t * vx;
      const qy = ay + t * vy;
      return Math.hypot(px - qx, py - qy);
    }

    function normalizeModels() {
      cityHotspots = CITY_HOTSPOTS_LL.map((d) => {
        const p = llToNorm(d.lon, d.lat);
        return { x: p.x, y: p.y, r: d.r, w: d.w };
      });

      roadSegments = ROAD_SEGMENTS_LL.map((d) => {
        const a = llToNorm(d.a.lon, d.a.lat);
        const b = llToNorm(d.b.lon, d.b.lat);
        return { a, b, w: d.w, r: d.r };
      });

      refuges = REFUGES_LL.map((d) => {
        const p = llToNorm(d.lon, d.lat);
        return { x: p.x, y: p.y, w: d.w };
      });
    }

    async function loadGeo() {
      const bounds = { minLon: Infinity, maxLon: -Infinity, minLat: Infinity, maxLat: -Infinity };
      const raw = [];

      for (let i = 0; i < SOUTH_PROVINCES.length; i += 1) {
        const prov = SOUTH_PROVINCES[i];
        const res = await fetch(`https://geo.datav.aliyun.com/areas_v3/bound/${prov.code}_full.json`);
        if (!res.ok) throw new Error(`fetch fail ${prov.code}`);
        const geo = await res.json();
        (geo.features || []).forEach((f) => {
          if (!f.geometry) return;
          const g = f.geometry;
          const polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
          polys.forEach((poly) => {
            const rings = poly.filter((r) => r && r.length >= 3).map((r) => r.map((pt) => ({ lon: pt[0], lat: pt[1] })));
            if (!rings.length) return;
            rings.forEach((ring) => {
              ring.forEach((pt) => {
                if (pt.lon < bounds.minLon) bounds.minLon = pt.lon;
                if (pt.lon > bounds.maxLon) bounds.maxLon = pt.lon;
                if (pt.lat < bounds.minLat) bounds.minLat = pt.lat;
                if (pt.lat > bounds.maxLat) bounds.maxLat = pt.lat;
              });
            });
            raw.push({ rings });
          });
        });
      }

      geoBounds = bounds;
      geoPolygons = raw.map((poly) => {
        const outer = poly.rings[0].map((pt) => llToNorm(pt.lon, pt.lat));
        const holes = poly.rings.slice(1).map((ring) => ring.map((pt) => llToNorm(pt.lon, pt.lat)));
        return { outer, holes };
      });
      normalizeModels();
      geoReady = true;
    }

    function fallbackGeo() {
      geoBounds = { minLon: 103, maxLon: 121.8, minLat: 20.1, maxLat: 31.8 };
      geoPolygons = [{
        outer: [
          llToNorm(103.6, 29.8), llToNorm(106.2, 31.4), llToNorm(110.9, 30.8), llToNorm(114.9, 30.9),
          llToNorm(118.7, 28.9), llToNorm(120.9, 25.8), llToNorm(117.5, 22.1), llToNorm(112.6, 21.6),
          llToNorm(108.1, 21.2), llToNorm(104.8, 23.1), llToNorm(103.8, 26.1)
        ],
        holes: []
      }];
      normalizeModels();
      geoReady = true;
    }

    function resize() {
      dpr = Math.max(1, window.devicePixelRatio || 1);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function spawnPoint(preferRefuge) {
      for (let i = 0; i < 120; i += 1) {
        let x, y;
        if (preferRefuge) {
          const r = refuges[Math.floor(Math.random() * refuges.length)] || { x: 0.56, y: 0.58 };
          x = r.x + rand(-0.055, 0.055);
          y = r.y + rand(-0.055, 0.055);
        } else {
          x = rand(0.05, 0.95);
          y = rand(0.05, 0.95);
        }
        if (!inHabitat(x, y)) continue;
        if (pressureAt(x, y) > 1.46) continue;
        return { x, y };
      }
      return { x: 0.56, y: 0.58 };
    }

    function createParticle(seedToRefuge = false) {
      const s = spawnPoint(seedToRefuge);
      return {
        x: s.x,
        y: s.y,
        vx: rand(-0.009, 0.009),
        vy: rand(-0.009, 0.009),
        energy: rand(0.68, 1),
        stride: rand(0.75, 1.25),
        phase: rand(0, Math.PI * 2),
        age: rand(0, 900),
        alive: true
      };
    }

    function reseed() {
      particles = [];
      const n = STAGES[stageIdx].particles;
      for (let i = 0; i < n; i += 1) particles.push(createParticle(stageIdx >= 2));
      stageNameEl.textContent = STAGES[stageIdx].name;
    }

    function sampleNeighbors(p, count = 16) {
      const out = [];
      if (particles.length <= 1) return out;
      for (let i = 0; i < count; i += 1) {
        const q = particles[(Math.random() * particles.length) | 0];
        if (q === p) continue;
        const d2 = dist2(p.x, p.y, q.x, q.y);
        if (d2 < 0.012) out.push({ q, d2 });
      }
      return out;
    }

    function stepParticle(p, dt) {
      const ns = sampleNeighbors(p, 16);
      let cohX = 0, cohY = 0, sepX = 0, sepY = 0, n = 0;

      for (let i = 0; i < ns.length; i += 1) {
        const q = ns[i].q;
        const d = Math.sqrt(ns[i].d2) + 1e-5;
        cohX += q.x;
        cohY += q.y;
        n += 1;
        if (d < 0.032) {
          sepX += (p.x - q.x) / d;
          sepY += (p.y - q.y) / d;
        }
      }

      if (n > 0) {
        cohX = cohX / n - p.x;
        cohY = cohY / n - p.y;
      }

      const g = pressureGradient(p.x, p.y);
      const fleeX = -g.x;
      const fleeY = -g.y;
      const r = nearestRefuge(p.x, p.y);
      const migX = r.x - p.x;
      const migY = r.y - p.y;
      const wX = Math.cos(p.phase + p.age * 0.03) * 0.75;
      const wY = Math.sin(p.phase * 0.8 + p.age * 0.025) * 0.75;

      p.vx += (cohX * 0.38 + sepX * 0.95 + fleeX * 0.56 + migX * STAGES[stageIdx].pressure * 0.72 + wX * 0.22) * dt;
      p.vy += (cohY * 0.38 + sepY * 0.95 + fleeY * 0.56 + migY * STAGES[stageIdx].pressure * 0.72 + wY * 0.22) * dt;

      p.vx *= 0.973;
      p.vy *= 0.973;

      const vmax = 0.2 * p.stride;
      const vl = Math.hypot(p.vx, p.vy) || 1e-6;
      if (vl > vmax) {
        p.vx = (p.vx / vl) * vmax;
        p.vy = (p.vy / vl) * vmax;
      }

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.age += dt * 60;

      if (!inHabitat(p.x, p.y)) {
        p.x = mix(p.x, r.x, 0.11);
        p.y = mix(p.y, r.y, 0.11);
        p.vx *= 0.5;
        p.vy *= 0.5;
      }

      const pr = pressureAt(p.x, p.y);
      const risk = clamp(pr - (0.46 - stageIdx * 0.08), 0, 2.5);
      if (Math.random() < STAGES[stageIdx].collapse * risk) p.alive = false;
    }

    function regulatePopulation() {
      const target = STAGES[stageIdx].particles;
      if (particles.length < target) {
        for (let i = 0; i < Math.min(target - particles.length, 3); i += 1) particles.push(createParticle(stageIdx >= 2));
      } else if (particles.length > target) {
        particles.length = Math.max(target, particles.length - 3);
      }
    }

    function drawBackground(now) {
      ctx.clearRect(0, 0, w, h);
      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, "#12151d");
      g.addColorStop(0.55, "#0e1118");
      g.addColorStop(1, "#0b0d12");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      // subtle vignette
      const v = ctx.createRadialGradient(w * 0.58, h * 0.56, 20, w * 0.58, h * 0.56, Math.max(w, h) * 0.66);
      v.addColorStop(0, "rgba(17,20,28,0)");
      v.addColorStop(1, "rgba(0,0,0,0.42)");
      ctx.fillStyle = v;
      ctx.fillRect(0, 0, w, h);
    }

    function drawTextField(now) {
      const cell = 12;
      const stage = STAGES[stageIdx];
      const t = now * 0.001;

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "8px STHeiti, PingFang SC, Microsoft YaHei, sans-serif";

      for (let y = Math.floor(h * 0.17); y < Math.floor(h * 0.88); y += cell) {
        for (let x = Math.floor(w * 0.14); x < Math.floor(w * 0.96); x += cell) {
          const nx = x / w;
          const ny = y / h;
          if (!pointInRegion(nx, ny)) continue;

          const p = pressureAt(nx, ny);
          const s = terrainSuit(nx, ny);
          const k = 0.5 + 0.5 * Math.sin(nx * 41 + ny * 27 + t * 1.2);
          const humanFactor = clamp(p * 1.15 + (stageIdx / 2) * 0.5, 0, 1.3);
          const natureFactor = clamp((s * 0.95) * (1.18 - humanFactor * 0.84), 0, 1);

          let glyph = "";
          let alpha = 0;
          let color = "rgba(201,208,220,0.4)";

          if (humanFactor > stage.threshold && Math.random() < 0.32 + humanFactor * 0.2) {
            glyph = CHAR_HUMAN[(Math.floor(nx * 57 + ny * 39 + t * 3.1) % CHAR_HUMAN.length + CHAR_HUMAN.length) % CHAR_HUMAN.length];
            alpha = clamp(0.07 + (humanFactor - stage.threshold) * 0.5 + k * 0.05, 0.06, 0.44);
            color = stageIdx === 2 ? "rgba(245, 164, 104, 0.44)" : "rgba(220, 223, 231, 0.42)";
          } else if (natureFactor > 0.25 && Math.random() < 0.34 + natureFactor * 0.28) {
            glyph = CHAR_NATURE[(Math.floor(nx * 47 + ny * 61 + t * 1.7) % CHAR_NATURE.length + CHAR_NATURE.length) % CHAR_NATURE.length];
            alpha = clamp(0.06 + natureFactor * 0.24 + k * 0.04, 0.04, 0.34);
            color = "rgba(216, 220, 229, 0.38)";
          }

          if (!glyph) continue;
          ctx.fillStyle = color.replace(/[\d.]+\)$/g, `${alpha})`);
          ctx.fillText(glyph, x, y);
        }
      }
    }

    function drawParticles() {
      for (let i = 0; i < particles.length; i += 1) {
        const p = particles[i];
        const x = p.x * w;
        const y = p.y * h;
        const speed = Math.hypot(p.vx, p.vy);

        const r = 0.72 + p.energy * 0.74;
        const glow = 2.2 + speed * 8;

        const grad = ctx.createRadialGradient(x, y, 0, x, y, glow);
        grad.addColorStop(0, "rgba(245, 163, 74, 0.9)");
        grad.addColorStop(0.55, "rgba(237, 132, 48, 0.42)");
        grad.addColorStop(1, "rgba(237, 132, 48, 0)");

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, glow, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255, 184, 96, 0.9)";
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function step(dt) {
      regulatePopulation();
      for (let i = particles.length - 1; i >= 0; i -= 1) {
        const p = particles[i];
        stepParticle(p, dt);
        if (!p.alive) particles.splice(i, 1);
      }
    }

    let prev = performance.now();
    function loop(now) {
      const dt = clamp((now - prev) / 1000, 0.001, 0.05);
      prev = now;
      step(dt);
      drawBackground(now);
      drawTextField(now);
      drawParticles();
      requestAnimationFrame(loop);
    }

    function setStage(i) {
      stageIdx = clamp(i, 0, STAGES.length - 1);
      stageNameEl.textContent = STAGES[stageIdx].name;
      reseed();
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "1") setStage(0);
      else if (e.key === "2") setStage(1);
      else if (e.key === "3") setStage(2);
    });

    window.addEventListener("resize", resize);

    async function init() {
      resize();
      try {
        await loadGeo();
      } catch (err) {
        console.error(err);
        fallbackGeo();
      }
      setStage(1);
      if (loadingEl) loadingEl.style.display = "none";
      requestAnimationFrame(loop);
    }

    init();
  </script>
</body>
