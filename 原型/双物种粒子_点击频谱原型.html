<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>双物种粒子点击频谱原型</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060a12;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <script>
    (() => {
      const SPECIES_CONFIG = [
        {
          key: "baiji",
          status: "extinct",
          imageFile: "白鳍豚.png",
          imageBases: ["../sours/crap/", "./sours/crap/", "sours/crap/"],
          audioFile: "白鳍豚.mp3",
          audioBases: ["../sours/sound/", "./sours/sound/", "sours/sound/"],
          tint: [145, 220, 255]
        },
        {
          key: "ibis",
          status: "endangered",
          imageFile: "朱鹮.png",
          imageBases: ["../sours/crap/", "./sours/crap/", "sours/crap/"],
          audioFile: "朱鹮.mp3",
          audioBases: ["../sours/sound/", "./sours/sound/", "sours/sound/"],
          tint: [255, 182, 209]
        }
      ];

      const PARTICLE_COUNT = 1500;
      const RASTER_WIDTH = 300;
      const ALPHA_CUTOFF = 20;
      const HOME_FOLLOW = 0.058;
      const SPECTRUM_FOLLOW = 0.082;
      const ALPHA_EASE = 0.08;
      const SIZE_EASE = 0.08;

      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d", { alpha: true });
      const off = document.createElement("canvas");
      const offCtx = off.getContext("2d", { willReadFrequently: true });

      let dpr = Math.min(window.devicePixelRatio || 1, 2);
      let W = 0;
      let H = 0;

      let audioCtx = null;
      let currentActive = null;
      let runtimeMessage = "";

      const species = [];

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        canvas.style.width = `${W}px`;
        canvas.style.height = `${H}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        species.forEach((sp, index) => {
          sp.anchor = getAnchor(index);
          if (sp.image) {
            buildSpeciesParticles(sp, true);
            if (sp.outcomeApplied) {
              if (sp.status === "extinct") applyExtinctOutcome(sp);
              else applyEndangeredOutcome(sp);
            }
          }
        });
      }

      function getAnchor(index) {
        if (W >= 920) {
          return {
            x: W * (index === 0 ? 0.33 : 0.67),
            y: H * 0.54
          };
        }
        return {
          x: W * 0.5,
          y: H * (index === 0 ? 0.35 : 0.73)
        };
      }

      function buildCandidates(file, bases) {
        const encoded = encodeURIComponent(file);
        const out = [];
        for (let i = 0; i < bases.length; i += 1) {
          out.push(`${bases[i]}${file}`);
          out.push(`${bases[i]}${encoded}`);
        }
        return Array.from(new Set(out));
      }

      function isCanvasTaintedError(err) {
        if (!err) return false;
        const name = String(err.name || "");
        const msg = String(err.message || "");
        return name === "SecurityError" || /tainted|cross-origin/i.test(msg);
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error(`load image failed: ${src}`));
          img.src = src;
        });
      }

      function loadImageFromBlob(blob, src) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(blob);
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url);
            img.__resolvedSrc = src;
            resolve(img);
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error(`blob image decode failed: ${src}`));
          };
          img.src = url;
        });
      }

      async function loadImageWithFallback(file, bases) {
        const cands = buildCandidates(file, bases);
        let lastErr = null;
        for (let i = 0; i < cands.length; i += 1) {
          const src = cands[i];
          try {
            let img = null;
            if (location.protocol !== "file:") {
              const res = await fetch(src, { cache: "no-store" });
              if (res.ok) {
                const blob = await res.blob();
                img = await loadImageFromBlob(blob, src);
              }
            }
            if (!img) img = await loadImage(src);
            img.__resolvedSrc = src;
            return img;
          } catch (err) {
            lastErr = err;
          }
        }
        throw lastErr || new Error("image load failed");
      }

      async function createAudioElement(file, bases) {
        const cands = buildCandidates(file, bases);
        for (let i = 0; i < cands.length; i += 1) {
          try {
            const res = await fetch(cands[i], { cache: "no-store" });
            if (!res.ok) continue;
            const audio = new Audio(cands[i]);
            audio.preload = "auto";
            audio.crossOrigin = "anonymous";
            return audio;
          } catch (_err) {
            // ignore and continue
          }
        }
        return null;
      }

      function makeSpeciesState(conf, index) {
        return {
          key: conf.key,
          conf,
          status: conf.status || "endangered",
          anchor: getAnchor(index),
          interactive: true,
          outcomeApplied: false,
          storyState: "intact",
          image: null,
          imageReady: false,
          audio: null,
          audioReady: false,
          analyser: null,
          source: null,
          gain: null,
          freqData: null,
          particles: [],
          homeTargets: [],
          hitMap: null,
          mode: "bio",
          spectrum: {
            cols: 56,
            width: 0,
            height: 0
          }
        };
      }

      function shuffledIndices(n) {
        const arr = new Uint32Array(n);
        for (let i = 0; i < n; i += 1) arr[i] = i;
        for (let i = n - 1; i > 0; i -= 1) {
          const j = (Math.random() * (i + 1)) | 0;
          const t = arr[i];
          arr[i] = arr[j];
          arr[j] = t;
        }
        return arr;
      }

      function buildSpeciesParticles(sp, reseed = false) {
        const img = sp.image;
        if (!img) return;

        const rw = RASTER_WIDTH;
        const rh = Math.max(80, Math.round((rw * img.height) / img.width));

        off.width = rw;
        off.height = rh;
        offCtx.clearRect(0, 0, rw, rh);

        offCtx.drawImage(img, 0, 0, rw, rh);
        let data = null;
        try {
          data = offCtx.getImageData(0, 0, rw, rh).data;
        } catch (err) {
          if (isCanvasTaintedError(err)) {
            runtimeMessage = "检测到图片跨域像素限制，请用本地 HTTP 服务打开该页面。";
            sp.particles = [];
            sp.homeTargets = [];
            sp.hitMap = null;
            return;
          }
          throw err;
        }

        const solid = [];
        for (let y = 0; y < rh; y += 1) {
          for (let x = 0; x < rw; x += 1) {
            const i = y * rw + x;
            const a = data[i * 4 + 3];
            if (a > ALPHA_CUTOFF) solid.push(i);
          }
        }

        if (!solid.length) {
          sp.particles = [];
          sp.homeTargets = [];
          return;
        }

        const scale = Math.min((W >= 920 ? W * 0.34 : W * 0.62) / rw, (H >= 920 ? H * 0.52 : H * 0.28) / rh);
        const ox = sp.anchor.x - (rw * scale) * 0.5;
        const oy = sp.anchor.y - (rh * scale) * 0.5;

        const order = shuffledIndices(solid.length);
        const home = [];

        for (let i = 0; i < PARTICLE_COUNT; i += 1) {
          const idx = solid[order[i % order.length]];
          const sx = idx % rw;
          const sy = (idx / rw) | 0;
          const jitter = 0.35;

          const tx = ox + (sx + (Math.random() * 2 - 1) * jitter) * scale;
          const ty = oy + (sy + (Math.random() * 2 - 1) * jitter) * scale;

          const p = idx * 4;
          const r = data[p];
          const g = data[p + 1];
          const b = data[p + 2];

          home.push({
            tx,
            ty,
            color: `rgb(${r}, ${g}, ${b})`,
            size: 0.82 + Math.random() * 1.4,
            alpha: 0.1 + Math.random() * 0.32
          });
        }

        if (!sp.particles.length || reseed) {
          sp.particles = home.map((h) => ({
            x: sp.anchor.x + (Math.random() * 2 - 1) * 65,
            y: sp.anchor.y + (Math.random() * 2 - 1) * 65,
            tx: h.tx,
            ty: h.ty,
            baseSize: h.size,
            baseAlpha: h.alpha,
            targetSize: h.size,
            targetAlpha: h.alpha,
            size: h.size,
            alpha: h.alpha,
            phase: Math.random() * Math.PI * 2,
            color: h.color
          }));
        } else {
          for (let i = 0; i < sp.particles.length; i += 1) {
            sp.particles[i].tx = home[i].tx;
            sp.particles[i].ty = home[i].ty;
            sp.particles[i].baseSize = home[i].size;
            sp.particles[i].baseAlpha = home[i].alpha;
            sp.particles[i].targetSize = home[i].size;
            sp.particles[i].targetAlpha = home[i].alpha;
            sp.particles[i].size = home[i].size;
            sp.particles[i].alpha = home[i].alpha;
            sp.particles[i].color = home[i].color;
          }
        }

        sp.homeTargets = home;
        sp.hitMap = {
          rw,
          rh,
          ox,
          oy,
          scale,
          alpha: new Uint8Array(rw * rh)
        };

        for (let i = 0; i < rw * rh; i += 1) sp.hitMap.alpha[i] = data[i * 4 + 3];

        sp.spectrum.width = Math.min(W >= 920 ? W * 0.3 : W * 0.7, 460);
        sp.spectrum.height = Math.min(H >= 920 ? H * 0.25 : H * 0.18, 220);
      }

      function ensureAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      }

      function ensureAudioGraph(sp) {
        if (!sp.audio) return false;
        ensureAudioContext();
        if (sp.source) return true;

        sp.source = audioCtx.createMediaElementSource(sp.audio);
        sp.analyser = audioCtx.createAnalyser();
        sp.analyser.fftSize = 256;
        sp.gain = audioCtx.createGain();
        sp.gain.gain.value = 0.95;

        sp.source.connect(sp.analyser);
        sp.analyser.connect(sp.gain);
        sp.gain.connect(audioCtx.destination);

        sp.freqData = new Uint8Array(sp.analyser.frequencyBinCount);
        return true;
      }

      function restoreBio(sp) {
        if (sp.storyState === "gone") return;
        sp.mode = "bio";
        const home = sp.homeTargets;
        const pts = sp.particles;
        for (let i = 0; i < pts.length; i += 1) {
          if (sp.storyState === "declined") continue;
          pts[i].tx = home[i].tx;
          pts[i].ty = home[i].ty;
          pts[i].targetAlpha = pts[i].baseAlpha;
          pts[i].targetSize = pts[i].baseSize;
        }
      }

      function applyExtinctOutcome(sp) {
        sp.storyState = "gone";
        sp.mode = "decay";
        sp.interactive = false;
        sp.hitMap = null;
        const pts = sp.particles;
        for (let i = 0; i < pts.length; i += 1) {
          const p = pts[i];
          const a = Math.random() * Math.PI * 2;
          const d = 130 + Math.random() * 340;
          p.tx = p.x + Math.cos(a) * d;
          p.ty = p.y + Math.sin(a) * d;
          p.targetAlpha = 0;
          p.targetSize = 0.08;
        }
      }

      function applyEndangeredOutcome(sp) {
        sp.storyState = "declined";
        sp.mode = "bio";
        sp.hitMap = null;

        const pts = sp.particles;
        const keep = Math.max(280, Math.floor(pts.length * 0.46));
        const order = shuffledIndices(pts.length);
        const keepFlag = new Uint8Array(pts.length);
        for (let i = 0; i < keep; i += 1) keepFlag[order[i]] = 1;
        const survivors = [];

        for (let i = 0; i < pts.length; i += 1) {
          const p = pts[i];
          if (keepFlag[i]) {
            const h = sp.homeTargets[i];
            const dx = h.tx - sp.anchor.x;
            const dy = h.ty - sp.anchor.y;
            const warp = 0.35 + Math.random() * 1.05;
            p.tx = h.tx + dx * 0.35 * warp + (Math.random() * 2 - 1) * 28;
            p.ty = h.ty + dy * 0.35 * warp + (Math.random() * 2 - 1) * 24;
            p.targetAlpha = Math.max(0.035, p.baseAlpha * 0.52);
            p.targetSize = Math.max(0.36, p.baseSize * 0.72);
            survivors.push(p);
            continue;
          }
        }

        sp.particles = survivors;
      }

      function applyPostAudioOutcome(sp) {
        if (sp.outcomeApplied) return;
        sp.outcomeApplied = true;
        if (sp.status === "extinct") {
          applyExtinctOutcome(sp);
          return;
        }
        applyEndangeredOutcome(sp);
      }

      function stopCurrentAudio() {
        if (!currentActive || !currentActive.audio) return;
        try {
          currentActive.audio.pause();
          currentActive.audio.currentTime = 0;
        } catch (_err) {
          // ignore
        }
        if (currentActive.mode === "spectrum") restoreBio(currentActive);
        currentActive = null;
      }

      function activateSpecies(sp) {
        if (!sp || !sp.audio || !sp.particles.length || !sp.interactive) return;
        if (sp.storyState === "gone") return;

        if (!ensureAudioGraph(sp)) return;

        if (currentActive && currentActive !== sp) stopCurrentAudio();

        currentActive = sp;
        sp.mode = "spectrum";
        if (sp.freqData) sp.freqData.fill(0);
        updateSpectrumTargets(sp, performance.now());
        try {
          sp.audio.pause();
          sp.audio.currentTime = 0;
        } catch (_err) {
          // ignore
        }

        sp.audio.play().catch(() => {
          restoreBio(sp);
          if (currentActive === sp) currentActive = null;
        });
      }

      function updateSpectrumTargets(sp, t) {
        const pts = sp.particles;
        if (!pts.length) return;

        const cols = sp.spectrum.cols;
        const rows = Math.ceil(pts.length / cols);
        const specW = sp.spectrum.width;
        const specH = sp.spectrum.height;

        const x0 = sp.anchor.x - specW * 0.5;
        const yBottom = sp.anchor.y + specH * 0.5;
        const rowGap = Math.max(1.45, specH / rows);

        if (sp.analyser && sp.freqData) sp.analyser.getByteFrequencyData(sp.freqData);

        for (let i = 0; i < pts.length; i += 1) {
          const col = i % cols;
          const row = (i / cols) | 0;
          const bin = Math.min(sp.freqData.length - 1, ((col / (cols - 1 || 1)) * (sp.freqData.length - 1)) | 0);
          const amp = (sp.freqData[bin] || 0) / 255;

          const wave = Math.sin(t * 0.0012 + col * 0.16) * 0.5 + 0.5;
          const h = 14 + (amp * 0.9 + wave * 0.1) * (specH * 0.84);
          const yTop = yBottom - h;

          const x = x0 + ((col + 0.5) / cols) * specW;
          let y = yBottom - (row + 0.5) * rowGap;
          if (y < yTop) {
            const spread = Math.max(1.5, h - 2);
            y = yTop + ((row * 1.7 + col * 0.8) % spread);
          }

          pts[i].tx = x;
          pts[i].ty = y;
        }
      }

      function updateParticles(sp, t) {
        const pts = sp.particles;
        const follow = sp.mode === "spectrum" ? SPECTRUM_FOLLOW : HOME_FOLLOW;
        const driftAmp = sp.mode === "spectrum" ? 0.12 : 0.24;
        for (let i = 0; i < pts.length; i += 1) {
          const p = pts[i];
          const dx = Math.sin(t * 0.00085 + p.phase) * driftAmp;
          const dy = Math.cos(t * 0.00072 + p.phase * 1.23) * driftAmp;
          p.x += (p.tx + dx - p.x) * follow;
          p.y += (p.ty + dy - p.y) * follow;
          p.alpha += (p.targetAlpha - p.alpha) * ALPHA_EASE;
          p.size += (p.targetSize - p.size) * SIZE_EASE;
        }
      }

      function drawBackground(t) {
        const g = ctx.createRadialGradient(W * 0.5, H * 0.45, 10, W * 0.5, H * 0.5, Math.max(W, H) * 0.8);
        g.addColorStop(0, "#102034");
        g.addColorStop(0.5, "#08111f");
        g.addColorStop(1, "#05090f");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }

      function drawRuntimeMessage() {
        if (!runtimeMessage) return;
        ctx.save();
        ctx.fillStyle = "rgba(5, 8, 14, 0.72)";
        ctx.fillRect(0, H - 58, W, 58);
        ctx.fillStyle = "rgba(232, 240, 255, 0.92)";
        ctx.font = "15px PingFang SC, Noto Sans SC, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(runtimeMessage, W * 0.5, H - 29);
        ctx.restore();
      }

      function render(t) {
        drawBackground(t);
        ctx.globalCompositeOperation = "lighter";

        for (let i = 0; i < species.length; i += 1) {
          const sp = species[i];
          if (!sp.particles.length) continue;

          if (sp === currentActive && sp.mode === "spectrum") {
            if (sp.audio && !sp.audio.paused) updateSpectrumTargets(sp, t);
          } else if (sp.mode === "spectrum") {
            restoreBio(sp);
          }

          updateParticles(sp, t);

          for (let k = 0; k < sp.particles.length; k += 1) {
            const p = sp.particles[k];
            ctx.globalAlpha = p.alpha * 0.72;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
        drawRuntimeMessage();

        requestAnimationFrame(render);
      }

      function hitByAlpha(sp, mx, my) {
        if (!sp.hitMap) return false;
        const hm = sp.hitMap;
        const lx = (mx - hm.ox) / hm.scale;
        const ly = (my - hm.oy) / hm.scale;
        if (lx < 0 || ly < 0 || lx >= hm.rw || ly >= hm.rh) return false;

        const x = lx | 0;
        const y = ly | 0;
        const idx = y * hm.rw + x;
        return hm.alpha[idx] > ALPHA_CUTOFF;
      }

      function hitByParticles(sp, mx, my) {
        const pts = sp.particles;
        for (let i = 0; i < pts.length; i += 1) {
          const p = pts[i];
          const dx = mx - p.x;
          const dy = my - p.y;
          if (dx * dx + dy * dy < 64) return true;
        }
        return false;
      }

      function pickSpecies(mx, my) {
        for (let i = 0; i < species.length; i += 1) {
          const sp = species[i];
          if (!sp.interactive) continue;
          if (!sp.particles.length) continue;
          if (hitByAlpha(sp, mx, my)) return sp;
        }
        for (let i = 0; i < species.length; i += 1) {
          const sp = species[i];
          if (!sp.interactive) continue;
          if (!sp.particles.length) continue;
          if (hitByParticles(sp, mx, my)) return sp;
        }
        return null;
      }

      async function init() {
        runtimeMessage = "";
        for (let i = 0; i < SPECIES_CONFIG.length; i += 1) {
          const conf = SPECIES_CONFIG[i];
          const sp = makeSpeciesState(conf, i);
          species.push(sp);

          try {
            sp.image = await loadImageWithFallback(conf.imageFile, conf.imageBases);
            sp.imageReady = true;
          } catch (err) {
            console.error(`[${sp.key}] image load failed`, err);
            runtimeMessage = "素材图片加载失败，请检查 sours/crap 与页面相对路径。";
          }

          sp.audio = await createAudioElement(conf.audioFile, conf.audioBases);
          sp.audioReady = !!sp.audio;
          if (sp.audio) {
            sp.audio.addEventListener("ended", () => {
              applyPostAudioOutcome(sp);
              if (currentActive === sp) currentActive = null;
            });
          }
        }

        try {
          resize();
        } catch (err) {
          console.error(err);
          runtimeMessage = "初始化失败：图片像素读取异常。建议使用 python3 -m http.server 启动。";
        }
        requestAnimationFrame(render);
      }

      canvas.addEventListener("pointerdown", (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const sp = pickSpecies(mx, my);
        if (!sp) return;
        activateSpecies(sp);
      });

      window.addEventListener("resize", () => {
        resize();
      });

      init();
    })();
  </script>
</body>
</html>
